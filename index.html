<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabajo JavaScript</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Trabajo JavaScript</h1>

  <section>
    <h2> Selecciona un color</h2>
    <select id="selectColor">
      <option value=""> Elige un color </option>
      <option value="red">Rojo</option>
      <option value="yellow">Amarillo</option>
      <option value="blue">Azul</option>
    </select>
    <button id="btnColor">Mostrar</button>
    <div id="cuadroColor" class="cuadro"></div>
  </section>

  <section>
    <h2> Selecciona una imagen</h2>
    <select id="selectImagen">
      <option value=""> Elige una imagen </option>
      <option value="bicicleta.png">Imagen 1</option>
      <option value="moto.png">Imagen 2</option>
      <option value="carro.avif">Imagen 3</option>
    </select>
    <button id="btnImagen">Mostrar</button>
    <div id="cuadroImagen" class="cuadro"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
